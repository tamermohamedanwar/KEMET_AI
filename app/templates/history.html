<!DOCTYPE html>
<html>
<head>
{% include "partials/kemet-white-ui.html" %}
<meta charset="utf-8">
<title>Kemet — History & Activity</title>

<style>
body {
    background:#f7f8fc;
    color:#151827;
    font-family:Arial, sans-serif;
    margin:0;
    padding:40px 20px;
}

.container {
    max-width:800px;
    margin:auto;
}

.card {
    background:#ffffff;
    color:#151827;
    padding:24px;
    margin-bottom:18px;
    border:1px solid #e6e8ef;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(16,24,40,.055);
}

.question {
    background:#f7f8fc;
    color:#344054;
    padding:15px;
    border:1px solid #e6e8ef;
    border-radius:11px;
}

.answer {
    background:#f3f1ff;
    color:#344054;
    padding:15px;
    border:1px solid #e1ddff;
    border-radius:11px;
}

a {
    color:#635bff;
    text-decoration:none;
    font-weight:700;
}
</style>


<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-ui.css') }}">
<script defer src="{{ url_for('static', filename='js/kemet-ui.js') }}"></script>


    <link rel="stylesheet" href="{{ url_for("static", filename="css/kemet-modern.css") }}">
</head>

<body class="kemet-public-shell">

<div class="container">

<h1>Kemet AI History</h1>

<a href="{{ url_for('dashboard.index') }}">
← Back to Chat
</a>

<hr>

{% for message in messages %}

<div class="card">

<h3>You</h3>
<div class="question">
{{ message.question }}
</div>

<br>

<h3>Kemet AI</h3>
<div class="answer">
{{ message.answer }}
</div>

</div>

{% else %}

<div class="card">
No conversations yet.
</div>

{% endfor %}

</div>

</body>
</html>

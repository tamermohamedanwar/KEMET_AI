<!DOCTYPE html>
<html>
<head>
{% include "partials/kemet-white-ui.html" %}
<meta charset="utf-8">
<title>Kemet AI History</title>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    margin:40px;
}

.container {
    max-width:800px;
    margin:auto;
}

.card {
    background:#1e293b;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
}

.question {
    background:#334155;
    padding:15px;
    border-radius:10px;
}

.answer {
    background:#374151;
    padding:15px;
    border-radius:10px;
}

a {
    color:white;
    text-decoration:none;
}
</style>


<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-ui.css') }}">
<script defer src="{{ url_for('static', filename='js/kemet-ui.js') }}"></script>


    <link rel="stylesheet" href="{{ url_for("static", filename="css/kemet-modern.css") }}">
</head>

<body>

<div class="container">

<h1>Kemet AI History</h1>

<a href="{{ url_for('dashboard.index') }}">
← Back to Chat
</a>

<hr>

{% for message in messages %}

<div class="card">

<h3>You</h3>
<div class="question">
{{ message.question }}
</div>

<br>

<h3>Kemet AI</h3>
<div class="answer">
{{ message.answer }}
</div>

</div>

{% else %}

<div class="card">
No conversations yet.
</div>

{% endfor %}

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
{% include "partials/kemet-white-ui.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - Kemet AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-ui.css') }}">
<script defer src="{{ url_for('static', filename='js/kemet-ui.js') }}"></script>


    <link rel="stylesheet" href="{{ url_for("static", filename="css/kemet-modern.css") }}">
</head>
<body>

<h2>تغيير كلمة المرور</h2>

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <div>{{ message }}</div>
    {% endfor %}
{% endwith %}

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>كلمة المرور الجديدة</label>
    <input type="password" name="password" minlength="8" required>

    <label>تأكيد كلمة المرور</label>
    <input type="password" name="confirm_password" minlength="8" required>

    <button type="submit">تغيير كلمة المرور</button>
</form>

</body>
</html>

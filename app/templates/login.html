<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kemet AI Login</title>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card {
    background:#1e293b;
    padding:35px;
    border-radius:15px;
    width:350px;
}

h1 {
    text-align:center;
}

input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
}

button {
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

a {
    color:#60a5fa;
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-v2.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-v3.css') }}">
</head>

<body>

<div class="card">

<h1>Kemet AI</h1>

<p>Login to your account</p>

<form method="POST">
{{ form.hidden_tag() }}

<input 
name="email"
type="email"
placeholder="Email"
required>

{{ form.password(placeholder="Password") }}

{{ form.submit() }}


</form>

<div style="text-align:center;margin:20px 0;color:#94a3b8;">
    OR
</div>

<a href="{{ url_for('auth.google') }}"
   style="display:block;text-align:center;background:#fff;color:#111827;
          padding:12px;border-radius:8px;text-decoration:none;
          margin-bottom:10px;font-weight:600;">
    Continue with Google
</a>

<a href="{{ url_for('auth.facebook') }}"
   style="display:block;text-align:center;background:#1877f2;color:#fff;
          padding:12px;border-radius:8px;text-decoration:none;
          font-weight:600;">
    Continue with Facebook
</a>


<br>

<p>
Don't have an account?
<a href="{{ url_for('auth.register') }}">
Register
</a>
</p>

</div>

<script src="{{ url_for('static', filename='js/kemet-v2.js') }}"></script>
<script src="{{ url_for('static', filename='js/kemet-v3.js') }}"></script>
</body>
</html>

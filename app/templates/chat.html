<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="csrf-token" content="{{ csrf_token() }}">

<title>Kemet AI</title>

<style>
:root{
    --chat-bg:#07111f;
    --chat-panel:#0d1a2b;
    --chat-panel-2:#111f33;
    --chat-border:rgba(255,255,255,.08);
    --chat-text:#f4f7fb;
    --chat-muted:#91a4ba;
    --chat-primary:#6d5dfc;
    --chat-cyan:#19c8ff;
    --chat-green:#28d17c;
}

*{
    box-sizing:border-box;
    font-family:Inter,Tahoma,Arial,sans-serif;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:
        radial-gradient(circle at 80% 0%,rgba(109,93,252,.14),transparent 30%),
        radial-gradient(circle at 10% 20%,rgba(25,200,255,.07),transparent 25%),
        var(--chat-bg);
    color:var(--chat-text);
    overflow:hidden;
}

body.light{
    --chat-bg:#f3f6fb;
    --chat-panel:#ffffff;
    --chat-panel-2:#f8fafc;
    --chat-border:#e2e8f0;
    --chat-text:#111827;
    --chat-muted:#64748b;
    background:var(--chat-bg);
    color:var(--chat-text);
}

.app{
    width:100%;
    height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
   ========================= */

.sidebar{
    width:270px;
    flex-shrink:0;
    padding:18px;
    background:rgba(13,26,43,.94);
    border-left:1px solid var(--chat-border);
    overflow-y:auto;
    box-shadow:10px 0 35px rgba(0,0,0,.12);
    backdrop-filter:blur(18px);
}

body.light .sidebar{
    background:#fff;
}

.sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:19px;
    font-weight:850;
}

.brand-mark{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:linear-gradient(135deg,var(--chat-primary),var(--chat-cyan));
    box-shadow:0 8px 25px rgba(109,93,252,.25);
}

.theme{
    width:38px;
    height:38px;
    border-radius:11px;
    border:1px solid var(--chat-border);
    background:rgba(255,255,255,.05);
    color:var(--chat-text);
    cursor:pointer;
}

.sidebar-section{
    margin:22px 4px 8px;
    color:var(--chat-muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:.08em;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    padding:11px 12px;
    margin-bottom:7px;
    border:1px solid transparent;
    border-radius:11px;
    color:var(--chat-text);
    text-decoration:none;
    background:rgba(255,255,255,.025);
    transition:.18s ease;
}

.chat-item:hover{
    transform:translateX(-2px);
    border-color:rgba(109,93,252,.25);
    background:rgba(109,93,252,.08);
}

/* =========================
   MAIN
   ========================= */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

.header{
    min-height:72px;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--chat-border);
    background:rgba(7,17,31,.72);
    backdrop-filter:blur(18px);
}

body.light .header{
    background:rgba(255,255,255,.82);
}

.header-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-avatar{
    width:42px;
    height:42px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--chat-primary),var(--chat-cyan));
    box-shadow:0 8px 25px rgba(109,93,252,.2);
}

.header-title{
    font-weight:850;
    font-size:16px;
}

.header-status{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--chat-muted);
    font-size:11px;
    margin-top:3px;
}

.online-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--chat-green);
    box-shadow:0 0 10px rgba(40,209,124,.7);
}

/* =========================
   MESSAGES
   ========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:28px clamp(16px,5vw,70px);
    scroll-behavior:smooth;
}

.message-row{
    display:flex;
    gap:10px;
    margin:16px 0;
}

.message-row.user{
    justify-content:flex-start;
}

.message-row.ai{
    justify-content:flex-end;
}

.avatar{
    width:34px;
    height:34px;
    flex:0 0 34px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

.ai-avatar{
    background:linear-gradient(135deg,var(--chat-primary),var(--chat-cyan));
}

.user-avatar{
    background:#243247;
}

.message{
    max-width:min(760px,82%);
    padding:13px 16px;
    border-radius:17px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
    border:1px solid var(--chat-border);
    box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.user{
    background:linear-gradient(135deg,#6d5dfc,#5143df);
    color:#fff;
    border-color:transparent;
    border-bottom-right-radius:5px;
}

.ai{
    background:var(--chat-panel-2);
    color:var(--chat-text);
    border-bottom-left-radius:5px;
}

body.light .ai{
    background:#fff;
    color:#111827;
    border-color:#e2e8f0;
}

.welcome{
    max-width:720px;
    margin:7vh auto 30px;
    text-align:center;
}

.welcome-icon{
    width:64px;
    height:64px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    font-size:28px;
    background:linear-gradient(135deg,var(--chat-primary),var(--chat-cyan));
    box-shadow:0 15px 40px rgba(109,93,252,.25);
}

.welcome h2{
    margin:0;
    font-size:27px;
}

.welcome p{
    color:var(--chat-muted);
    line-height:1.7;
}

/* =========================
   INPUT
   ========================= */

.input-box{
    display:flex;
    align-items:center;
    gap:9px;
    margin:0 clamp(12px,4vw,60px) 16px;
    padding:9px;
    border:1px solid var(--chat-border);
    border-radius:18px;
    background:rgba(13,26,43,.86);
    box-shadow:0 15px 40px rgba(0,0,0,.18);
    backdrop-filter:blur(18px);
}

body.light .input-box{
    background:rgba(255,255,255,.94);
}

#message{
    flex:1;
    min-width:0;
    height:48px;
    padding:0 15px;
    border:0;
    outline:0;
    border-radius:13px;
    background:transparent;
    color:var(--chat-text);
    font-size:14px;
}

#message::placeholder{
    color:var(--chat-muted);
}

.upload,
.voice,
.send{
    width:45px;
    height:45px;
    flex:0 0 45px;
    border:1px solid var(--chat-border);
    border-radius:13px;
    cursor:pointer;
    transition:.18s ease;
}

.upload{
    background:rgba(255,255,255,.05);
    color:var(--chat-text);
}

.voice{
    background:rgba(40,209,124,.12);
    color:#5ee89b;
}

.send{
    background:linear-gradient(135deg,var(--chat-primary),var(--chat-cyan));
    color:#fff;
    box-shadow:0 8px 20px rgba(109,93,252,.22);
}

.upload:hover,
.voice:hover,
.send:hover{
    transform:translateY(-2px);
}

/* =========================
   MOBILE
   ========================= */

.menu-btn{
    display:none;
}

@media(max-width:800px){

    .sidebar{
        position:fixed;
        top:0;
        right:-290px;
        height:100vh;
        z-index:3000;
        transition:right .22s ease;
    }

    .sidebar.open{
        right:0;
    }

    .menu-btn{
        display:flex;
        position:fixed;
        bottom:85px;
        right:18px;
        z-index:3100;
        width:50px;
        height:50px;
        align-items:center;
        justify-content:center;
        border:0;
        border-radius:15px;
        background:linear-gradient(135deg,var(--chat-primary),var(--chat-cyan));
        color:#fff;
        font-size:21px;
        box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    .header{
        padding:12px 15px;
    }

    .messages{
        padding:20px 12px;
    }

    .message{
        max-width:88%;
    }

    .input-box{
        margin:0 8px 8px;
    }

    .upload,
    .voice,
    .send{
        width:42px;
        height:42px;
        flex-basis:42px;
    }
}

@media(max-width:480px){

    .header-title{
        font-size:14px;
    }

    .header-avatar{
        width:38px;
        height:38px;
    }

    .message{
        font-size:13px;
        padding:11px 13px;
    }

    .welcome h2{
        font-size:22px;
    }

    #message{
        font-size:13px;
    }
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-v2.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-v3.css') }}">
</head>

<body>
{% include "partials/sidebar.html" %}

<button class="menu-btn" onclick="toggleSidebar()">☰</button>


<div class="app">



<main class="main">

<header class="header">
    <div class="header-info">
        <div class="header-avatar">🤖</div>
        <div>
            <div class="header-title">Kemet AI Assistant</div>
            <div class="header-status">
                <span class="online-dot"></span>
                AI Assistant Online
            </div>
        </div>
    </div>
</header>

<div class="messages" id="messages">
        {% if not messages %}
        <div class="welcome">
            <div class="welcome-icon">✦</div>
            <h2>How can Kemet AI help?</h2>
            <p>
                Ask questions, analyze your knowledge base,
                or start a new AI-powered conversation.
            </p>
        </div>
        {% endif %}

{% for m in messages %}
<div class="message user">
{{m.question}}
</div>

<div class="message ai">
{{m.answer}}
</div>
{% endfor %}

</div>

<div class="input-box">

<input 
id="message"
type="text"
placeholder="اكتب رسالتك..."
onkeydown="if(event.key==='Enter') sendMessage()">

<input id="fileInput" type="file" hidden>

<button class="upload" onclick="document.getElementById('fileInput').click()">
📄
</button>

<button class="voice" onclick="startVoiceInput()">
🎤
</button>

<button class="send" onclick="sendMessage()">
➤
</button>

</div>

</main>

</div>


<script>

const csrfToken = document
.querySelector('meta[name="csrf-token"]')
.content;


function addMessage(text,type){

    const box=document.getElementById("messages");

    const div=document.createElement("div");

    div.className="message "+type;

    div.innerText=text;

    box.appendChild(div);

    box.scrollTop=box.scrollHeight;
}


let currentConversationId = null;

async function sendMessage(){

    const input = document.getElementById("message");
    const text = input.value.trim();

    if(!text){
        return;
    }

    addMessage(text, "user");
    input.value = "";

    try{
        const response = await fetch("/api/chat", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({
                message: text,
                conversation_id: currentConversationId
            })
        });

        console.log("CHAT STATUS:", response.status);

        const raw = await response.text();
        console.log("CHAT RESPONSE:", raw);

        let data;
        try {
            data = JSON.parse(raw);
        } catch(e) {
            if(response.status === 401 || response.status === 302 || raw.includes("/login")) {
                addMessage("انتهت جلسة تسجيل الدخول. أعد تسجيل الدخول ثم حاول مرة أخرى.", "ai");
            } else {
                addMessage("Server error: HTTP " + response.status, "ai");
            }
            return;
        }

        if(!response.ok){
            addMessage(
                data.error || data.message || ("HTTP " + response.status),
                "ai"
            );
            return;
        }

        if(data.reply){
            addMessage(data.reply, "ai");

            // حفظ رقم المحادثة
            if(data.conversation_id){
                currentConversationId = data.conversation_id;
            }
        }else{
            addMessage("حدث خطأ في الرد", "ai");
        }

    }catch(error){
        console.log(error);
        addMessage("Connection error", "ai");
    }
}



function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "kemet_theme",
        document.body.classList.contains("light")
    );

}



if(localStorage.getItem("kemet_theme")==="true"){

    document.body.classList.add("light");

}



function startVoiceInput(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Voice not supported");

return;

}


const recognition=new SpeechRecognition();


recognition.lang="ar-EG";

recognition.start();


recognition.onresult=function(event){

const text =
event.results[0][0].transcript;


document.getElementById("message").value=text;


sendMessage();

};


}




document.getElementById("fileInput")?.addEventListener(
"change",
uploadFile
);


async function uploadFile(){

const file =
document.getElementById("fileInput").files[0];

if(!file){
return;
}

let formData = new FormData();

formData.append("file", file);


const response = await fetch("/upload",{
method:"POST",
body:formData
});


const data = await response.json();


if(data.success){

addMessage(
"تم رفع الملف: " + data.filename,
"ai"
);

}else{

addMessage(
"فشل رفع الملف",
"ai"
);

}

}

function toggleSidebar(){
let side=document.querySelector(".sidebar");
side.classList.toggle("open");
}
</script>


<script src="{{ url_for('static', filename='js/kemet-v2.js') }}"></script>
<script src="{{ url_for('static', filename='js/kemet-v3.js') }}"></script>
</body>

</html>

width:55px;
height:55px;

font-size:25px;
z-index:999;
}
}

    position:fixed;
    bottom:90px;

    z-index:2000;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#facc15;
    color:#111;
    font-size:26px;
}

</style>

    .mobile-menu{

        left:14px;

        width:44px;
        height:44px;
        align-items:center;
        justify-content:center;

        border-radius:12px;

<button class="mobile-menu" onclick="toggleMobileSidebar()" aria-label="Open menu">
    ☰
</button>

<div class="sidebar-overlay" onclick="closeMobileSidebar()"></div>

<script>
function toggleMobileSidebar(){
    const sidebar = document.querySelector('.unified-sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    if(!sidebar) return;

    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('active');
}

function closeMobileSidebar(){
    const sidebar = document.querySelector('.unified-sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    if(!sidebar) return;

    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('active');
}

document.addEventListener('click', function(e){
    const link = e.target.closest('.unified-sidebar a');

    if(link && window.innerWidth <= 700){
        closeMobileSidebar();
    }
});
</script>

<!-- KEMET MOBILE SIDEBAR V2 -->

<button id="kemetMobileMenuBtn"
        class="kemet-mobile-menu-btn"
        type="button"
        aria-label="Open menu"
        aria-expanded="false">
    ☰
</button>

<div id="kemetMobileOverlay" class="kemet-mobile-overlay"></div>

<style>
/* =========================================================
   KEMET AI — MOBILE SIDEBAR
   ========================================================= */

.kemet-mobile-menu-btn,
.kemet-mobile-overlay {
    display: none;
}

@media (max-width: 700px) {

    /* Hide sidebar completely on mobile */
    .unified-sidebar {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        width: min(280px, 82vw) !important;
        height: 100dvh !important;

        z-index: 10001 !important;

        transform: translateX(-110%) !important;
        visibility: hidden !important;

        transition:
            transform .25s ease,
            visibility .25s ease !important;

        overflow-y: auto !important;
        overflow-x: hidden !important;

        box-shadow: 12px 0 35px rgba(0,0,0,.25) !important;
    }

    /* Open state */
    body.kemet-mobile-sidebar-open .unified-sidebar {
        transform: translateX(0) !important;
        visibility: visible !important;
    }

    /* Dark overlay */
    .kemet-mobile-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;

        display: block;

        background: rgba(0,0,0,.48);
        backdrop-filter: blur(2px);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity .25s ease,
            visibility .25s ease;
    }

    body.kemet-mobile-sidebar-open .kemet-mobile-overlay {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    /* Floating menu button */
    .kemet-mobile-menu-btn {
        display: flex;

        position: fixed;
        left: 14px;
        top: 14px;

        width: 52px;
        height: 52px;

        z-index: 10002;

        align-items: center;
        justify-content: center;

        border: 0;
        border-radius: 16px;

        background: linear-gradient(
            135deg,
            #17243a,
            #263a58
        );

        color: #fff;

        font-size: 27px;
        line-height: 1;

        cursor: pointer;

        box-shadow:
            0 10px 28px rgba(0,0,0,.28),
            0 0 0 1px rgba(255,255,255,.08);

        -webkit-tap-highlight-color: transparent;
    }

    .kemet-mobile-menu-btn:active {
        transform: scale(.94);
    }

    /* Prevent page from shifting underneath sidebar */
    body.kemet-dashboard,
    body {
        overflow-x: hidden !important;
    }

    /* Main content must use the full phone width */
    .kemet-dashboard .main,
    .main {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
    }

    /* Chat pages */
    .chat-page,
    .chat-layout,
    .chat-main,
    .chat-container {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
    }
}
</style>

<script>
(function () {

    function initKemetMobileSidebar() {

        const btn = document.getElementById("kemetMobileMenuBtn");
        const overlay = document.getElementById("kemetMobileOverlay");

        if (!btn || !overlay) return;

        function openSidebar() {
            document.body.classList.add("kemet-mobile-sidebar-open");
            btn.setAttribute("aria-expanded", "true");
            btn.innerHTML = "✕";
        }

        function closeSidebar() {
            document.body.classList.remove("kemet-mobile-sidebar-open");
            btn.setAttribute("aria-expanded", "false");
            btn.innerHTML = "☰";
        }

        function toggleSidebar() {
            if (document.body.classList.contains("kemet-mobile-sidebar-open")) {
                closeSidebar();
            } else {
                openSidebar();
            }
        }

        btn.onclick = toggleSidebar;
        overlay.onclick = closeSidebar;

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeSidebar();
            }
        });

        document.querySelectorAll(".unified-sidebar a").forEach(function (link) {
            link.addEventListener("click", function () {
                if (window.innerWidth <= 700) {
                    closeSidebar();
                }
            });
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initKemetMobileSidebar);
    } else {
        initKemetMobileSidebar();
    }

})();
</script>

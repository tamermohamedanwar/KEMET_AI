<!DOCTYPE html>
<html>
<head>
{% include "partials/kemet-white-ui.html" %}
<meta charset="utf-8">
<title>Kemet AI Register</title>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card {
    background:#1e293b;
    padding:35px;
    border-radius:15px;
    width:350px;
}

h1 {
    text-align:center;
}

input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
}

button {
    width:100%;
    padding:12px;
    background:#374151;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

a {
    color:#9ca3af;
}
</style>


<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-ui.css') }}">
<script defer src="{{ url_for('static', filename='js/kemet-ui.js') }}"></script>


    <link rel="stylesheet" href="{{ url_for("static", filename="css/kemet-modern.css") }}">
</head>

<body>

<section class="k-v51-auth">
    <div class="k-v51-auth-card">
        <h1>Build with Kemet AI</h1>
        <p class="k-v51-muted">Create your workspace and start operating with AI.</p>


<div class="card">

<h1>Kemet AI</h1>

<p>Create your account</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input
name="full_name"
type="text"
placeholder="Full Name"
required>

<input
name="email"
type="email"
placeholder="Email"
required>

<input
name="password"
type="password"
placeholder="Password"
required>

<button type="submit">
Register
</button>


</form>

<div style="text-align:center;margin:20px 0;color:#94a3b8;">
    OR
</div>

<a href="{{ url_for('auth.google') }}"
   style="display:block;text-align:center;background:#fff;color:#111827;
          padding:12px;border-radius:8px;text-decoration:none;
          margin-bottom:10px;font-weight:600;">
    Sign up with Google
</a>

<a href="{{ url_for('auth.facebook') }}"
   style="display:block;text-align:center;background:#1877f2;color:#fff;
          padding:12px;border-radius:8px;text-decoration:none;
          font-weight:600;">
    Sign up with Facebook
</a>


<br>

<p>
Already have an account?
<a href="{{ url_for('auth.login') }}">
Login
</a>
</p>

</div>

</div>
</section>
</body>
</html>

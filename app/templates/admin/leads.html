<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Kemet AI Leads</title>

<style>
body{
    font-family:Tahoma,Arial;
    background:#08111f;
    color:white;
    padding:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#111827;
}

th,td{
    padding:15px;
    border-bottom:1px solid #334155;
    text-align:right;
}

th{
    background:#1e293b;
}

h1{
    margin-bottom:30px;
}

.btn{
    background:#2563eb;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    border:0;
    cursor:pointer;
}

.status{
    padding:5px 10px;
    border-radius:12px;
    background:#334155;
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-v2.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/kemet-v3.css') }}">
</head>

<body>

<h1>طلبات التجربة المجانية</h1>

<table>

<tr>
<th>الشركة</th>
<th>البريد</th>
<th>الرسالة</th>
<th>الحالة</th>
<th>التاريخ</th>
<th>الإجراء</th>
</tr>


{% for lead in leads %}

<tr>

<td>{{ lead.company_name }}</td>

<td>{{ lead.email }}</td>

<td>{{ lead.message or "-" }}</td>

<td>
<span class="status">
{{ lead.status }}
</span>
</td>

<td>
{{ lead.created_at }}
</td>

<td>

{% if lead.status != "converted" %}

<form method="POST"
action="{{ url_for('admin_leads.convert_lead', lead_id=lead.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<button class="btn">
تحويل إلى عميل
</button>

</form>

{% else %}

تم التحويل

{% endif %}

</td>

</tr>

{% endfor %}


</table>


<script src="{{ url_for('static', filename='js/kemet-v2.js') }}"></script>
<script src="{{ url_for('static', filename='js/kemet-v3.js') }}"></script>
</body>
</html>

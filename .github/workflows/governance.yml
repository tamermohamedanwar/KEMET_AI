name: Kemet Governance Gates

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Governance and execution-boundary gates
        env:
          FLASK_ENV: testing
          RATELIMIT_STORAGE_URI: memory://
        run: |
          python -m pytest -q \
            tests/kemet/test_governed_worker.py \
            tests/kemet/test_revenue_autopilot_governance.py \
            tests/kemet/test_worker_evidence_terminal.py
